---
# Task 1 - Ansible for Configuration Management
#
#   1. Install Docker (+ Compose plugin)
#   2. Pull the application image
#   3. Run the container automatically, and keep it running across reboots
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml
#   ansible-playbook site.yml -e app_image_tag=v1.2.0
#   ansible-playbook site.yml --tags app          # redeploy only
#   ansible-playbook site.yml --check --diff      # dry run

- name: Provision the web server with Docker and the application
  hosts: web
  gather_facts: true
  become: false

  pre_tasks:
    - name: Wait for the host to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Show what will be deployed
      ansible.builtin.debug:
        msg: "Deploying {{ app_image }} to {{ inventory_hostname }} (mode: {{ app_deploy_mode }})"

  roles:
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
